<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пульт смены</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<style>
  /* Layout: sticky control bar с вкладками; ниже — активная вкладка (Смена / Календарь / Обмены) в одну колонку шириной до 1000px */
  /* Зелёный акцент; тема белая по умолчанию, чёрная по переключателю/системе. Офис — бордовый */
  :root{
    --bg:#f4f7f5; --surface:#ffffff; --surface-2:#eef2f0; --border:#dde4e0;
    --fg:#17241d; --fg-muted:#59685f; --fg-faint:#8a988f;
    --accent:#1f9d57; --accent-fg:#ffffff; --accent-soft:#e4f3ea;
    --on:#1f9d57; --on-bg:#e4f3ea;
    --lunch:#bf7d16; --lunch-bg:#faeedb;
    --off:#76827a; --off-bg:#eaeeec;
    --night:#5666c6; --night-bg:#e8eaf8;
    --office:#9e2a46; --office-bg:#f8e4e9;
    --danger:#c43c3c; --danger-bg:#fbe8e8;
    --shadow:0 1px 2px rgba(20,35,25,.06), 0 6px 20px rgba(20,35,25,.05);
    --font:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#060908; --surface:#0d120e; --surface-2:#151c16; --border:#232d25;
    --fg:#e7f1ea; --fg-muted:#8ba294; --fg-faint:#5c6e63;
    --accent:#2fd176; --accent-fg:#04140a; --accent-soft:#102a1b;
    --on:#2fd176; --on-bg:#102a1b;
    --lunch:#a9da50; --lunch-bg:#1f2a10;
    --off:#6a7c70; --off-bg:#171f18;
    --night:#8f9cf0; --night-bg:#1b2140;
    --office:#e8718c; --office-bg:#2e151b;
    --danger:#e0645c; --danger-bg:#2a1513;
    --shadow:0 1px 2px rgba(0,0,0,.55), 0 10px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#060908; --surface:#0d120e; --surface-2:#151c16; --border:#232d25;
    --fg:#e7f1ea; --fg-muted:#8ba294; --fg-faint:#5c6e63;
    --accent:#2fd176; --accent-fg:#04140a; --accent-soft:#102a1b;
    --on:#2fd176; --on-bg:#102a1b;
    --lunch:#a9da50; --lunch-bg:#1f2a10;
    --off:#6a7c70; --off-bg:#171f18;
    --night:#8f9cf0; --night-bg:#1b2140;
    --office:#e8718c; --office-bg:#2e151b;
    --danger:#e0645c; --danger-bg:#2a1513;
    --shadow:0 1px 2px rgba(0,0,0,.55), 0 10px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.45;-webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0;text-wrap:balance}
  button{font-family:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}

  .bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
  .bar-in{max-width:1000px;margin:0 auto;padding-top:13px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .bar-top{display:flex;align-items:center;gap:12px}
  .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);flex:none;display:grid;place-items:center}
  .mark span{width:11px;height:11px;border-radius:50%;background:var(--accent-fg)}
  .bar h1{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .bar .sub{font-size:12px;color:var(--fg-muted);font-weight:500}
  .live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--fg-muted);font-variant-numeric:tabular-nums}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--off)}
  .dot.ok{background:var(--on)}
  .dot.ok.anim{animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,209,118,.5)}100%{box-shadow:0 0 0 7px rgba(47,209,118,0)}}
  @media (prefers-reduced-motion:reduce){.dot.anim{animation:none}}

  .tabs{display:flex;gap:4px;margin-top:12px;justify-content:center}
  .tab{position:relative;appearance:none;border:none;background:none;color:var(--fg-muted);font-size:13.5px;font-weight:600;white-space:nowrap;
    padding:10px 4px 12px;border-bottom:2px solid transparent;flex:1;max-width:170px;transition:color .15s}
  @media (max-width:380px){.tab{font-size:12.5px}}
  .tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
  .tab .badge{display:inline-block;min-width:18px;padding:0 5px;height:18px;line-height:18px;border-radius:9px;
    background:var(--danger);color:#fff;font-size:11px;font-weight:700;margin-left:6px;vertical-align:1px}

  main{max-width:1000px;margin:0 auto;padding-block:18px 56px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .pane{display:flex;flex-direction:column;gap:16px}
  .pane[hidden]{display:none}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
  .sec-h{display:flex;align-items:baseline;gap:10px;padding:16px 18px 0}
  .sec-h h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .sec-h .count{font-size:12px;color:var(--fg-faint);font-weight:600;font-variant-numeric:tabular-nums;margin-left:auto}
  .sec-body{padding:12px 18px 18px}

  /* Личная карточка */
  .me{padding:18px}
  .me-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .ava{width:46px;height:46px;border-radius:50%;flex:none;background:var(--surface-2);display:grid;place-items:center;font-weight:600;font-size:16px;color:var(--fg-muted);overflow:hidden}
  .ava img{width:100%;height:100%;object-fit:cover}
  .me-id .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-faint);font-weight:600}
  .me-id .nm{font-size:19px;font-weight:600;letter-spacing:-.01em}
  .me-state{margin-left:auto;text-align:right}
  .me-timer{font-family:var(--mono);font-size:13px;color:var(--fg-muted);font-variant-numeric:tabular-nums;margin-top:6px}
  .me-timer b{color:var(--fg);font-weight:600}
  .actions{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .claim{margin-top:16px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:13px}
  .claim-t{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--fg-muted);margin-bottom:10px}
  .claim-t .ic{width:16px;height:16px;color:var(--accent)}

  .btn{border:1px solid var(--border);background:var(--surface-2);color:var(--fg);font-size:14px;font-weight:600;
    padding:11px 16px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .05s,background .15s,border-color .15s}
  .btn:hover{border-color:var(--fg-faint)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.5;cursor:default;transform:none}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.on{background:var(--on-bg);border-color:transparent;color:var(--on)}
  .btn.lunch{background:var(--lunch-bg);border-color:transparent;color:var(--lunch)}
  .btn.danger{background:var(--danger-bg);border-color:transparent;color:var(--danger)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:8px 13px;font-size:13px}
  .btn.block{width:100%}
  .ic{width:16px;height:16px;flex:none}

  .pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap}
  .pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
  .pill.on{background:var(--on-bg);color:var(--on)}
  .pill.lunch{background:var(--lunch-bg);color:var(--lunch)}
  .pill.off{background:var(--off-bg);color:var(--off)}

  ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
  .row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;min-width:0}
  .row.tap{cursor:pointer;transition:background .12s}
  .row.tap:hover{background:var(--surface-2)}
  .row.tap::after{content:"›";color:var(--fg-faint);font-size:20px;line-height:1;flex:none;margin-left:2px}
  .row:hover{background:var(--surface-2)}
  .row .ava{width:34px;height:34px;font-size:13px}
  .row .who{min-width:0;flex:1}
  .row .who .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .you{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:middle}
  .together{color:var(--on);background:var(--on-bg)}
  .adminrow{display:flex;gap:8px;padding-left:4px}
  .adminrow .btn{flex:1}
  .daygrp{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--fg-muted);text-transform:uppercase;margin:4px 2px 2px}
  .row .who .t{font-size:12px;color:var(--fg-faint);font-family:var(--mono);font-variant-numeric:tabular-nums}
  .row .rt{font-family:var(--mono);font-size:12.5px;color:var(--fg-muted);font-variant-numeric:tabular-nums;white-space:nowrap}

  /* История часов */
  .hist{display:flex;flex-direction:column;gap:1px}
  .hbar-row{display:grid;grid-template-columns:92px 1fr auto;align-items:center;gap:10px;padding:5px 0}
  .hbar-row .d{font-size:12.5px;color:var(--fg-muted);font-variant-numeric:tabular-nums}
  .hbar-row .track{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
  .hbar-row .fill{height:100%;background:var(--accent);border-radius:5px}
  .hbar-row .v{font-family:var(--mono);font-size:12.5px;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
  .hbar-row.today .d{color:var(--accent);font-weight:600}

  /* Календарь */
  .day{border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .day+.day{margin-top:11px}
  .day.is-today{border-color:var(--accent)}
  .mnav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .navbtn{width:40px;height:40px;flex:none;border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:10px;display:grid;place-items:center}
  .navbtn:hover:not(:disabled){border-color:var(--accent)}
  .navbtn:disabled{opacity:.4;cursor:default}
  .navbtn .ic{width:18px;height:18px}
  .mlabel{flex:1;text-align:center;font-size:16px;font-weight:700;letter-spacing:-.01em;text-transform:capitalize}
  .day-h{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface-2)}
  .day-h .dow{font-weight:700;font-size:14px;text-transform:capitalize}
  .day-h .dt{font-size:12.5px;color:var(--fg-muted);font-variant-numeric:tabular-nums}
  .day-h .tdlabel{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:6px}
  .day-h .add{margin-left:auto}
  .day-body{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .day-empty{color:var(--fg-faint);font-size:13px;padding:4px 2px}
  .shift{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);
    border-radius:10px;padding:9px 12px;color:var(--fg);transition:border-color .12s,background .12s}
  .shift:hover{border-color:var(--accent)}
  .shift.mine{border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
  .shift .bar-k{width:4px;align-self:stretch;border-radius:3px;background:var(--off);flex:none}
  .shift.k-day .bar-k{background:var(--on)}
  .shift.k-night .bar-k{background:var(--night)}
  .shift .s-who{min-width:0;flex:1}
  .shift .s-who .nm{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .shift .s-who .s-sub{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--office);margin-top:3px}
  .shift .s-who .s-sub .ic{width:13px;height:13px}
  .shift.office{box-shadow:inset 3px 0 0 var(--office)}
  .shift .s-time{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--fg-muted);white-space:nowrap}
  .shift .s-time .s-ki{width:14px;height:14px;flex:none}
  .shift.k-day .s-time .s-ki{color:var(--on)} .shift.k-night .s-time .s-ki{color:var(--night)}
  .shift .chev{color:var(--fg-faint);flex:none}

  /* Кнопка темы */
  .iconbtn{width:34px;height:34px;flex:none;border:1px solid var(--border);background:var(--surface);color:var(--fg-muted);border-radius:9px;display:grid;place-items:center;margin-left:10px}
  .iconbtn:hover{border-color:var(--accent);color:var(--fg)}
  .iconbtn .ic{width:17px;height:17px}

  /* Месячная сетка календаря */
  .calfilter{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .calfilter label{font-size:12px;font-weight:600;color:var(--fg-muted);white-space:nowrap}
  .calfilter select{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 11px}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin:12px 2px 10px;font-size:12px;color:var(--fg-muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .legend .lg-day{background:var(--on)} .legend .lg-night{background:var(--night)} .legend .lg-off{background:var(--office)}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
  .cal-dow span{text-align:center;font-size:11px;font-weight:600;color:var(--fg-faint);padding:3px 0}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-cell{min-height:58px;border:1px solid var(--border);border-radius:9px;background:var(--surface);padding:5px 4px;display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:border-color .12s;overflow:hidden}
  .cal-cell.blank{background:transparent;border-color:transparent;cursor:default}
  .cal-cell:not(.blank):hover{border-color:var(--accent)}
  .cal-cell.today{border-color:var(--accent)}
  .cal-cell.has{box-shadow:none}
  .cal-cell .dn{font-size:12px;font-weight:600;color:var(--fg-muted);line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:3px}
  .cal-cell.today .dn{color:var(--accent)}
  .cal-cell.office .dn{color:var(--office);font-weight:700}
  .cal-cell .dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
  .cdot{width:8px;height:8px;border-radius:50%;background:var(--off)}
  .cdot.day{background:var(--on)} .cdot.night{background:var(--night)}
  .cdot.mine{box-shadow:0 0 0 2px var(--surface),0 0 0 3.3px var(--accent)}
  .cal-cell .more{font-size:9px;color:var(--fg-faint);font-weight:600}

  /* Недельная строка часов */
  .wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .wkd{border:1px solid var(--border);border-radius:9px;padding:7px 2px 8px;min-height:74px;background:var(--surface);
    display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
  .wkd.today{border-color:var(--accent)}
  .wkd.future{opacity:.45}
  .wkd.tap{cursor:pointer;transition:border-color .12s,transform .05s}
  .wkd.tap:hover{border-color:var(--accent)}
  .wkd.tap:active{transform:translateY(1px)}
  .wkd .wd{font-size:10px;font-weight:700;color:var(--fg-faint);text-transform:uppercase;letter-spacing:.03em}
  .wkd .wn{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .wkd.today .wn{color:var(--accent)}
  .wkd .wk-ic{width:15px;height:15px;margin-top:1px}
  .wkd.day .wk-ic{color:var(--on)} .wkd.night .wk-ic{color:var(--night)}
  .wkd .wh{font-size:10.5px;font-family:var(--mono);color:var(--fg-muted);font-variant-numeric:tabular-nums}
  .wkd .wdash{color:var(--fg-faint);font-size:12px;margin-top:2px}
  .wk-sum{margin-top:12px;font-size:13px;color:var(--fg-muted)}
  .wk-sum b{color:var(--fg);font-weight:700}

  /* Мини-календарь выбора смены в обмене */
  .pick{border:1px solid var(--border);border-radius:11px;padding:11px;background:var(--surface)}
  .pick-nav{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .pick-nav .mlabel{font-size:13.5px}
  .pick-nav .navbtn{width:32px;height:32px}
  .pick-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .pick-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
  .pick-dow span{text-align:center;font-size:10px;font-weight:600;color:var(--fg-faint)}
  .pc{min-height:42px;border:1px solid transparent;border-radius:8px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--fg-faint)}
  .pc.blank{}
  .pc .pn{font-size:11px;font-weight:600;color:var(--fg-muted);font-variant-numeric:tabular-nums}
  .pc.has{cursor:pointer;background:var(--surface-2);border-color:var(--border);color:var(--fg)}
  .pc.has:hover{border-color:var(--accent)}
  .pc.has .pn{color:var(--fg)}
  .pc.sel{background:var(--accent);border-color:var(--accent)}
  .pc.sel .pn,.pc.sel .pk{color:var(--accent-fg)}
  .pc .pk{display:inline-flex;align-items:center;gap:2px;font-size:9px;font-weight:600;line-height:1}
  .pc .pk .ic{width:10px;height:10px}
  .pc.k-day .pk{color:var(--on)} .pc.k-night .pk{color:var(--night)}
  .noswap{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px dashed var(--border);background:transparent;color:var(--fg-muted);
    font-size:13px;font-weight:600;padding:10px;border-radius:9px;margin-top:10px}
  .noswap.on{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

  /* Формы */
  form.panel{display:flex;flex-direction:column;gap:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
  form.panel[hidden]{display:none}
  label.fl{font-size:12px;font-weight:600;color:var(--fg-muted);display:block;margin-bottom:5px}
  input.ti,select.se,input[type=date].ti,input[type=time].ti{width:100%;font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 12px}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  .fr{display:flex;gap:10px;flex-wrap:wrap}
  .fr>*{flex:1;min-width:120px}
  .presets{display:flex;gap:8px;flex-wrap:wrap}
  .chipbtn{border:1px solid var(--border);background:var(--surface);color:var(--fg-muted);font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:8px}
  .chipbtn:hover{border-color:var(--accent);color:var(--fg)}

  /* Обмены / уведомления */
  .swap{border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:11px}
  .swap.incoming{border-color:var(--accent);background:var(--accent-soft)}
  .swap-ttl{font-size:13px;color:var(--fg-muted)}
  .swap-ttl b{color:var(--fg)}
  .trade{display:flex;align-items:stretch;gap:10px}
  .trade .leg{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 11px}
  .trade .leg .cap{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-faint);font-weight:600;margin-bottom:3px}
  .trade .leg .val{font-size:13px;font-weight:600;line-height:1.3}
  .trade .leg .tm{font-family:var(--mono);font-size:12.5px;color:var(--fg-muted);font-variant-numeric:tabular-nums}
  .trade .arr{align-self:center;color:var(--fg-faint);flex:none}
  .swap-foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .swap .verdict{font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .verdict.ok{color:var(--on)} .verdict.no{color:var(--danger)}
  .dismiss{margin-left:auto;appearance:none;border:none;background:none;color:var(--fg-faint);font-size:18px;line-height:1;padding:4px;border-radius:6px}
  .dismiss:hover{color:var(--danger)}

  .empty{text-align:center;color:var(--fg-muted);font-size:14px;padding:26px 12px;line-height:1.55}
  .empty svg{width:34px;height:34px;color:var(--fg-faint);margin-bottom:8px}
  .note-info{font-size:12.5px;color:var(--fg-muted);background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px 13px;display:flex;gap:9px;align-items:flex-start}
  .note-info svg{width:16px;height:16px;flex:none;color:var(--accent);margin-top:1px}

  /* Модалка обмена */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:0}
  .scrim[hidden]{display:none}
  @media (min-width:560px){.scrim{align-items:center;padding:20px}}
  .sheet{background:var(--surface);width:100%;max-width:460px;border-radius:16px 16px 0 0;box-shadow:var(--shadow);
    padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
  @media (min-width:560px){.sheet{border-radius:16px}}
  .sheet h3{font-size:16px;font-weight:700}
  .sheet .pivot{background:var(--surface-2);border-radius:10px;padding:11px 13px;font-size:13px}
  .sheet .pivot .nm{font-weight:600}

  /* История смен */
  .slog{display:flex;flex-direction:column;gap:6px}
  .slog-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--border);border-radius:11px;background:var(--surface)}
  .slog-item.live{border-color:var(--accent);background:var(--accent-soft)}
  .slog-item .bar-k2{width:4px;align-self:stretch;min-height:34px;border-radius:3px;background:var(--off);flex:none}
  .slog-item .bar-k2.k-day{background:var(--on)} .slog-item .bar-k2.k-night{background:var(--night)}
  .slog-mid{flex:1;min-width:0}
  .slog-date{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;text-transform:capitalize}
  .slog-date .ic{width:14px;height:14px;flex:none}
  .slog-item.k-day .slog-date .ic{color:var(--on)} .slog-item.k-night .slog-date .ic{color:var(--night)}
  .slog-time{font-family:var(--mono);font-size:12.5px;color:var(--fg-muted);font-variant-numeric:tabular-nums;margin-top:3px}
  .slog-dur{text-align:right;white-space:nowrap}
  .slog-dur b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  .slog-live{font-size:11px;font-weight:700;color:var(--accent);margin-top:2px}
  .slog-day{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--fg-muted);text-transform:uppercase;margin:10px 2px 2px}
  .slog-day:first-child{margin-top:2px}

  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));
    background:var(--fg);color:var(--bg);font-size:13px;font-weight:500;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:88vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-2px)}
</style>

      <button class="tab" role="tab" id="tab-cal" aria-selected="false" aria-controls="pane-cal">Календарь</button>
      <button class="tab" role="tab" id="tab-swap" aria-selected="false" aria-controls="pane-swap">Обмены</button>
      <button class="tab" role="tab" id="tab-hist" aria-selected="false" aria-controls="pane-hist">История</button>
    </div>
  </div>
</div>

<main>
  <div class="pane" id="pane-shift" role="tabpanel" aria-labelledby="tab-shift">
    <section class="card me" id="meCard" aria-live="polite"></section>
    <section class="card" aria-labelledby="hHist">
      <div class="sec-h"><h2 id="hHist">Ваши часы</h2><span class="count" id="histCount"></span></div>
      <div class="sec-body" id="histBody"></div>
    </section>
    <section class="card" aria-labelledby="hTeam">
      <div class="sec-h"><h2 id="hTeam">Команда сейчас</h2><span class="count" id="teamCount"></span></div>
      <div class="sec-body" id="teamBody"></div>
    </section>
  </div>

  <div class="pane" id="pane-cal" role="tabpanel" aria-labelledby="tab-cal" hidden>
    <section class="card" aria-labelledby="hCal">
      <div class="sec-h"><h2 id="hCal">Смены команды</h2><span class="count" id="calCount"></span></div>
      <div class="sec-body" id="calBody"></div>
    </section>
  </div>

  <div class="pane" id="pane-swap" role="tabpanel" aria-labelledby="tab-swap" hidden>
    <section class="card" aria-labelledby="hIn">
      <div class="sec-h"><h2 id="hIn">Входящие</h2><span class="count" id="inCount"></span></div>
      <div class="sec-body" id="inBody"></div>
    </section>
    <section class="card" aria-labelledby="hOut">
      <div class="sec-h"><h2 id="hOut">Исходящие и недавние</h2></div>
      <div class="sec-body" id="outBody"></div>
    </section>
  </div>

  <div class="pane" id="pane-hist" role="tabpanel" aria-labelledby="tab-hist" hidden>
    <section class="card" aria-labelledby="hLog">
      <div class="sec-h"><h2 id="hLog">История смен</h2><span class="count" id="histLogCount"></span></div>
      <div class="sec-body" id="histLogBody"></div>
    </section>
  </div>
</main>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Предложить обмен"></div></div>
<div id="toast" role="status"></div>

<script>
(function(){
  "use strict";
  var db=null, user=null, myId=null;
  var rawDb=null, FV=null;              // прямой доступ к Firestore (для транзакций и FieldValue)
  var MAXSEG=24*3600;                   // защита от «зависшего» workStart (устройство уснуло на смене)
  var roster={}, sessions={}, schedule={}, swaps={};
  var writing=false, activeTab="shift";
  var ready={roster:false,sessions:false,schedule:false,swaps:false};
  var addFor=null;      // дата, для которой открыта форма добавления смены
  var sheet=null;       // state модалки обмена
  var dayModal=null;    // дата открытой карточки дня (модалка)
  var hoursModal=null;  // дата открытого окна «часы за день» (из «Ваши часы»)
  var superModal=null;  // uid участника — панель супервайзера (смены сотрудника)
  var superForm=null;   // {uid,name,mode:'close'|'edit',origStart,startMs,endMs,secs}
  var confirmModal=null;// {title,message,yes,onYes} — окно подтверждения
  var editModal=null;   // sid редактируемой смены (только для старших)
  var amAdmin=false;    // текущий пользователь — старший смены
  var calFilter="";     // "" = вся команда, иначе userId
  var calView={y:new Date().getFullYear(), m:new Date().getMonth()}; // просматриваемый месяц календаря
  var calAutoJumped=false; // один раз перескочить на ближайший месяц со сменами

  // ---------- helpers ----------
  function elx(tag,attrs,kids){
    var n=document.createElement(tag); attrs=attrs||{};
    for(var k in attrs){ var v=attrs[k]; if(v==null) continue;
      if(k==="class") n.className=v;
      else if(k==="text") n.textContent=v;
      else if(k==="html") n.innerHTML=v;
      else if(k==="hidden"){ if(v) n.hidden=true; }
      else if(k.slice(0,2)==="on"&&typeof v==="function") n.addEventListener(k.slice(2),v);
      else n.setAttribute(k,v);
    }
    kids=kids||[]; for(var i=0;i<kids.length;i++){var c=kids[i]; if(c==null) continue; n.append(c.nodeType?c:document.createTextNode(c));}
    return n;
  }
  function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
  function txt(s){ return document.createTextNode(s==null?"":String(s)); }
  function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("show");},2800); }
  function pad(n){ return (n<10?"0":"")+n; }
  function todayKey(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function dateKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function parseKey(k){ var p=k.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }

  function ago(ts){ if(!ts) return ""; var s=(Date.now()-ts)/1000;
    if(s<45) return "только что"; var m=Math.round(s/60); if(m<60) return m+" мин назад";
    var h=Math.floor(m/60); if(h<10) return h+" ч назад";
    var d=new Date(ts); return d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"})+", "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}); }
  function fmtDur(secs){ secs=Math.max(0,Math.round(secs)); var h=Math.floor(secs/3600), m=Math.floor((secs%3600)/60);
    if(h&&m) return h+" ч "+m+" мин"; if(h) return h+" ч"; return m+" мин"; }
  function plural(n,one,few,many){ var a=Math.abs(n)%100, b=a%10; if(a>10&&a<20)return many; if(b>1&&b<5)return few; if(b===1)return one; return many; }
  function stateOf(d){ if(!d||d.status!=="on") return "off"; return d.lunch?"lunch":"on"; }
  var LABEL={on:"На смене",lunch:"На обеде",off:"Не на смене"};
  function initials(name){ if(!name) return ""; var p=name.trim().split(/\s+/); return ((p[0]||"")[0]||"").toUpperCase()+((p[1]||"")[0]||"").toUpperCase(); }

  function kindOf(start){ if(!start) return "day"; var h=+String(start).split(":")[0]; return (h>=19||h<7)?"night":"day"; }
  function kindClass(k){ return k==="night"?"k-night":"k-day"; }
  function kindName(k){ return k==="night"?"Ночная":"Дневная"; }
  function isOfficeDay(dateStr,k){ if(k!=="day"||!dateStr) return false; var wd=parseKey(dateStr).getDay(); return wd===2||wd===4; } // Вт/Чт, только дневная

  var ICON={
    swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3 8l4 4"/><path d="M3 8h13a4 4 0 0 1 4 4"/><path d="m17 20 4-4-4-4"/><path d="M21 16H8a4 4 0 0 1-4-4"/></svg>',
    sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>',
    info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
    cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
    users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
    chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
    chevL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
    office:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/></svg>',
    arr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>'
  };
  function ico(name,cls){ var s=document.createElement("span"); s.innerHTML=ICON[name]; var e=s.firstChild; e.setAttribute("class",(cls||"ic")); return e; }
  function avatar(p,name,cls){ var a=elx("div",{class:"ava "+(cls||"")});
    if(p&&p.avatarUrl){ a.append(elx("img",{src:p.avatarUrl,alt:"",referrerpolicy:"no-referrer"})); } else { a.textContent=initials(name)||"?"; } return a; }
  function btn(label,variant,handler,icon){ var cls="btn"+(variant?" "+variant:""); var b=elx("button",{class:cls,type:"button"});
    if(handler) b.addEventListener("click",handler); if(icon) b.append(ico(icon)); b.append(txt(label)); if(writing) b.disabled=true; return b; }

  // ---------- тема ----------
  function curTheme(){ try{ return localStorage.getItem("ps-theme")||"system"; }catch(e){ return "system"; } }
  function applyTheme(t){ try{ var r=document.documentElement; if(t==="light"||t==="dark") r.setAttribute("data-theme",t); else r.removeAttribute("data-theme"); }catch(e){} }
  function effectiveDark(){ var t=curTheme(); if(t==="dark")return true; if(t==="light")return false;
    try{ return window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches; }catch(e){ return false; } }
  function updateThemeBtn(){ var b=document.getElementById("themeBtn"); if(!b)return; clear(b); b.append(ico(effectiveDark()?"sun":"moon","ic")); b.title=effectiveDark()?"Светлая тема":"Тёмная тема"; }
  function toggleTheme(){ var nx=effectiveDark()?"light":"dark"; try{ localStorage.setItem("ps-theme",nx); }catch(e){} applyTheme(nx); updateThemeBtn(); }

  // ---------- derived data ----------
  function teamIds(){ var s={}; Object.keys(roster).forEach(function(i){s[i]=1;}); Object.keys(sessions).forEach(function(i){s[i]=1;});
    Object.keys(schedule).forEach(function(k){ if(schedule[k].userId) s[schedule[k].userId]=1; }); if(myId) s[myId]=1; return Object.keys(s); }
  function myShifts(){ return Object.keys(schedule).map(function(k){return schedule[k];}).filter(function(s){return s.userId===myId;})
      .sort(function(a,b){ return (a.date+a.start).localeCompare(b.date+b.start); }); }
  function shiftsOf(uid){ return Object.keys(schedule).map(function(k){return schedule[k];}).filter(function(s){return s.userId===uid;})
      .sort(function(a,b){ return (a.date+a.start).localeCompare(b.date+b.start); }); }
  function importedSlots(){ var m={}; Object.keys(schedule).forEach(function(k){ var s=schedule[k];
      if(s.userId&&s.userId.slice(0,4)==="imp:"&&!m[s.userId]) m[s.userId]={uid:s.userId,name:s.name||s.userId}; });
      return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return a.name.localeCompare(b.name);}); }
  function shiftLabel(id){ var s=schedule[id]; if(!s) return null; return s; }
  function liveToday(d){ if(!d) return 0; if(d.dayKey!==todayKey()) return 0; var base=d.todaySecs||0;
    if(d.status==="on"&&!d.lunch&&d.workStart){ var s=(Date.now()-d.workStart)/1000; if(s>0&&s<MAXSEG) base+=s; } return base; }
  // Длительность ТЕКУЩЕЙ смены — считается от выхода на смену и не обнуляется в полночь (важно для ночных смен)
  function liveShift(d){ if(!d||d.status==="off") return 0; var base=d.shiftSecs||0;
    if(d.status==="on"&&!d.lunch&&d.workStart){ var s=(Date.now()-d.workStart)/1000; if(s>0&&s<MAXSEG) base+=s; } return base; }
  function incomingCount(){ var c=0; Object.keys(swaps).forEach(function(k){var s=swaps[k]; if(s.status==="pending"&&s.toId===myId)c++;}); return c; }

  function toMin(t){ if(!t)return 0; var p=String(t).split(":"); return (+p[0])*60+(+p[1]||0); }
  function shiftHours(s){ if(!s||!s.start||!s.end)return 0; var span=((toMin(s.end)-toMin(s.start))+1440)%1440; if(span===0)span=1440; var h=span/60-1; return Math.max(0,h); } // минус час обед
  function mondayOf(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); var wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
  function shiftOnFor(uid,key){ for(var k in schedule){ var s=schedule[k]; if(s.userId===uid&&s.date===key) return s; } return null; }
  function userName(P,uid){ if(P[uid]&&P[uid].name) return P[uid].name; var sd=null; for(var k in schedule){ if(schedule[k].userId===uid){ sd=schedule[k]; break; } } if(sd&&sd.name) return sd.name; return uid===myId?"Вы":"Коллега"; }
  function knownUsers(P){ var ids=teamIds(), seen={}, arr=[]; ids.forEach(function(id){ if(seen[id])return; seen[id]=1; arr.push({uid:id,name:userName(P,id)}); });
    arr.sort(function(a,b){ if(a.uid===myId)return -1; if(b.uid===myId)return 1; return a.name.localeCompare(b.name); }); return arr; }
  function monthMap(y,m,filterUid){ var map={}; Object.keys(schedule).forEach(function(k){ var s=schedule[k]; if(!s.date)return; var d=parseKey(s.date);
    if(d.getFullYear()!==y||d.getMonth()!==m)return; if(filterUid&&s.userId!==filterUid)return; (map[s.date]=map[s.date]||[]).push(k); }); return map; }

  // ---------- profiles ----------
  var seq=0;
  function render(){ var my=++seq; var ids=teamIds(); Object.keys(swaps).forEach(function(k){var s=swaps[k]; if(s.fromId)ids.push(s.fromId); if(s.toId)ids.push(s.toId);});
    var uniq={}; ids=ids.filter(function(i){ if(!i||uniq[i])return false; uniq[i]=1; return true;});
    if(user&&ids.length){ user.profiles(ids).then(function(p){ if(my===seq) paint(p||{}); }); } else { paint({}); } }
  function nameFor(p,id){ var x=p[id]; if(x&&x.name) return x.name; return id===myId?"Вы":"Коллега"; }
  function ownerName(s,P){ if(!s) return "Коллега"; if(s.userId===myId) return nameFor(P,myId); if(s.name) return s.name; return nameFor(P,s.userId); }

  // ---------- paint ----------
  function paint(P){
    // header live
    var dot=document.getElementById("livedot"), lt=document.getElementById("livetxt");
    if(!db){ dot.className="dot"; lt.textContent="нет связи"; } else { dot.className="dot ok anim"; lt.textContent="вживую"; }
    // tab badge
    var inc=db?incomingCount():0; var tabSwap=document.getElementById("tab-swap");
    tabSwap.textContent="Обмены"; if(inc){ tabSwap.append(elx("span",{class:"badge",text:String(inc)})); }

    if(activeTab==="shift"){ paintMe(P); paintHist(P); paintTeam(P); }
    else if(activeTab==="cal"){ paintCal(P); }
    else if(activeTab==="hist"){ paintHistory(P); }
    else { paintSwaps(P); }
    if(confirmModal) paintConfirm(); else if(editModal) paintEditSheet(P); else if(dayModal) paintDaySheet(P); else if(hoursModal) paintHoursSheet(P); else if(superForm) paintSuperForm(P); else if(superModal) paintSuperSheet(P); else if(sheet) paintSheet(P);
  }

  function askConfirm(title,message,yesLabel,onYes){ sheet=null; dayModal=null; hoursModal=null;
    confirmModal={title:title,message:message,yes:yesLabel||"Да",onYes:onYes};
    document.getElementById("scrim").hidden=false; render(); }
  function paintConfirm(){ var host=document.getElementById("sheet"); clear(host);
    host.append(elx("h3",{text:confirmModal.title}));
    host.append(elx("div",{style:"font-size:14px;color:var(--fg-muted);line-height:1.5"},[ txt(confirmModal.message) ]));
    host.append(btn(confirmModal.yes,"primary block",function(){ var cb=confirmModal.onYes; confirmModal=null; document.getElementById("scrim").hidden=true; if(cb) cb(); }));
    host.append(btn("Отмена","ghost block",function(){ closeModal(); }));
  }

  function paintMe(P){
    var box=document.getElementById("meCard"); clear(box);
    var meP=myId?P[myId]:null, myName=myId?(meP&&meP.name?meP.name:"Вы"):null, d=myId?roster[myId]:null, st=stateOf(d);
    box.append(elx("div",{class:"me-top"},[
      avatar(meP,myName),
      elx("div",{class:"me-id"},[ elx("div",{class:"lbl",text:"Ваш статус"}), elx("div",{class:"nm",text: myId?myName:"Гость"}) ]),
      elx("div",{class:"me-state"},[ elx("span",{class:"pill "+st,text:LABEL[st]}),
        elx("div",{class:"me-timer"},[ txt(st!=="off"?"На смене уже: ":"Сегодня отработано: "),
          elx("b",{text:fmtDur(st!=="off"?liveShift(d):liveToday(d))}) ]) ])
    ]));
    if(!db){ box.append(elx("div",{class:"note-info",style:"margin-top:16px"},[ico("info"),txt("Нет связи с базой. Обновите страницу.")])); return; }
    if(!myId){
      if(window.__FB && window.__FB.domainRejected && window.__FB.domainRejected()){
        box.append(elx("div",{class:"note-info",style:"margin-top:16px;border-color:var(--danger);color:var(--danger)"},[ico("info"),txt("Вход только с рабочего аккаунта @bbsoft.bet. Выберите рабочую почту.")]));
      } else {
        box.append(elx("div",{class:"note-info",style:"margin-top:16px"},[ico("info"),txt("Войдите рабочим Google-аккаунтом @bbsoft.bet, чтобы отмечать смену, вести часы и меняться сменами.")]));
      }
      box.append(elx("div",{class:"actions"},[ btn("Войти через Google","primary",function(){ window.__FB.signIn(); },"users") ]));
      return;
    }
    var acts=elx("div",{class:"actions"});
    if(st==="off"){ acts.append(btn("Выйти на смену","primary",function(){setStatus("on",false);})); }
    else if(st==="on"){ acts.append(btn("Уйти на обед","lunch",function(){setStatus("on",true);},"sun")); acts.append(btn("Завершить смену","ghost",function(){setStatus("off",false);})); }
    else { acts.append(btn("Вернуться с обеда","on",function(){setStatus("on",false);})); acts.append(btn("Завершить смену","ghost",function(){setStatus("off",false);})); }
    box.append(acts);

    // привязка импортированных смен к своему аккаунту — только пока сам ничего не привязал
    var imp=importedSlots();
    if(imp.length && myImportedGroups().length===0){
      var sel=elx("select",{class:"se",id:"claim-sel"});
      imp.forEach(function(it){ sel.append(elx("option",{value:it.uid,text:it.name})); });
      if(meP&&meP.name){ imp.forEach(function(it){ if(it.name===meP.name) sel.value=it.uid; }); }
      box.append(elx("div",{class:"claim"},[
        elx("div",{class:"claim-t"},[ ico("swap","ic"), txt("Привязать смены из графика к своему аккаунту") ]),
        elx("div",{class:"fr"},[ sel, btn("Это мои смены","primary sm",function(){
          var s=document.getElementById("claim-sel"); var uid=s.value;
          var nm=(s.options[s.selectedIndex]&&s.options[s.selectedIndex].text)||"этот график";
          askConfirm("Привязать график","Привязать к вам весь график «"+nm+"»? Все смены этой роли станут вашими. Отвязать можно ниже в любой момент.","Да, привязать",function(){ claimSlot(uid); });
        }) ])
      ]));
    }

    // уже привязанные к себе роли — можно отвязать
    var groups=myImportedGroups();
    if(groups.length){
      var gbox=elx("div",{class:"claim"});
      gbox.append(elx("div",{class:"claim-t"},[ ico("info","ic"), txt("Привязанные к вам смены из графика") ]));
      groups.forEach(function(gr){
        gbox.append(elx("div",{class:"fr",style:"align-items:center;margin-top:8px"},[
          elx("div",{style:"flex:1;min-width:0;font-size:13px;font-weight:600"},[ txt(gr.name+" — "+gr.ids.length+" смен") ]),
          btn("Отвязать","danger sm",function(){ unclaimSlot(gr.slot,gr.ids); })
        ]));
      });
      box.append(gbox);
    }

    box.append(elx("div",{style:"margin-top:14px"},[ btn("Выйти","ghost sm",function(){ window.__FB.signOut(); }) ]));
  }

  function paintHist(P){
    var body=document.getElementById("histBody"), cnt=document.getElementById("histCount"); clear(body); cnt.textContent="";

  function superCommit(sf,entry){ // entry=null => удалить запись (режим edit)
    if(!amAdmin){ toast("Только для старшего"); return; }
    if(!rawDb){ toast("Обновите страницу"); return; }
    var sRef=rawDb.collection("sessions").doc(sf.uid), rRef=rawDb.collection("roster").doc(sf.uid), now=Date.now();
    writing=true; render();
    rawDb.runTransaction(function(t){
      return t.get(sRef).then(function(ss){
        var data=(ss&&ss.exists)?ss.data():{}; var log=Array.isArray(data.log)?data.log.slice():[];
        if(sf.mode==="edit"){ var idx=-1; for(var i=0;i<log.length;i++){ if(log[i]&&log[i].start===sf.origStart){ idx=i; break; } }
          if(idx>=0){ if(entry) log[idx]=entry; else log.splice(idx,1); } else if(entry){ log.push(entry); } }
        else if(entry){ log.push(entry); }
        t.set(sRef,{log:log,updatedAt:now},{merge:true});
        if(sf.mode==="close") t.set(rRef,{status:"off",lunch:false,workStart:null,shiftStart:null,shiftSecs:0,todaySecs:0,dayKey:todayKey(),updatedAt:now});
        return null;
      });
    }).then(function(){ writing=false; var uid=sf.uid; superForm=null; superModal=uid; render();
        toast(sf.mode==="close"?"Смена сотрудника завершена":(entry?"Часы обновлены":"Запись удалена")); })
     .catch(function(e){ writing=false; render(); console.warn("superCommit",e);
        toast(e&&e.code==="permission-denied"?"Нужны права старшего в базе — обновите правила Firestore":"Не удалось сохранить"); });
  }

  function cap(s){ return s? s.charAt(0).toUpperCase()+s.slice(1):s; }

  function shiftMonth(delta){ var d=new Date(calView.y,calView.m+delta,1); var now=new Date();
    if(d.getFullYear()<now.getFullYear() || (d.getFullYear()===now.getFullYear()&&d.getMonth()<now.getMonth())) return;
    calAutoJumped=true; calView={y:d.getFullYear(),m:d.getMonth()}; addFor=null; render(); }
  function maybeAutoJump(){ if(calAutoJumped) return; calAutoJumped=true;
    var tag=calView.y+"-"+pad(calView.m+1);
    var hasCur=Object.keys(schedule).some(function(k){ var d=schedule[k].date; return d&&d.slice(0,7)===tag; });
    if(hasCur) return;
    var dates=Object.keys(schedule).map(function(k){return schedule[k].date;}).filter(Boolean).sort();
    if(!dates.length) return;
    var fut=dates.filter(function(d){ return d>=todayKey(); });
    var pick=fut[0]||dates[dates.length-1]; var p=pick.split("-");
    calView={y:+p[0],m:+p[1]-1}; }

  function paintSwaps(P){
    var inB=document.getElementById("inBody"), inC=document.getElementById("inCount"), outB=document.getElementById("outBody"); clear(inB); clear(outB);
    if(!db){ inB.append(elx("div",{class:"note-info"},[ico("info"),txt("Нет связи с хранилищем.")])); return; }
    if(!myId){ inB.append(elx("div",{class:"empty"},[txt("Обмены доступны после входа в аккаунт.")])); return; }
    if(!ready.swaps){ inB.append(skeleton(2)); outB.append(skeleton(2)); return; }

    var keys=Object.keys(swaps);
    var incoming=keys.filter(function(k){return swaps[k].status==="pending"&&swaps[k].toId===myId;}).sort(newest);
    var outgoing=keys.filter(function(k){return swaps[k].status==="pending"&&swaps[k].fromId===myId;}).sort(newest);
    var recent=keys.filter(function(k){var s=swaps[k]; return s.status!=="pending" && (s.fromId===myId||s.toId===myId) && (Date.now()-(s.resolvedAt||0)<3*86400000);}).sort(function(a,b){return (swaps[b].resolvedAt||0)-(swaps[a].resolvedAt||0);});

    inC.textContent= incoming.length? incoming.length+" ждут ответа":"";
    if(!incoming.length){ inB.append(empty("bell","Новых предложений об обмене нет.\nКогда коллега предложит обмен, оно появится здесь.")); }
    else { var w=elx("div",{style:"display:flex;flex-direction:column;gap:12px"}); incoming.forEach(function(id){ w.append(swapCard(id,P,"in")); }); inB.append(w); }

    if(!outgoing.length && !recent.length){ outB.append(elx("div",{class:"empty"},[txt("Пока ничего. Предложить обмен можно во вкладке «Календарь».")])); }
    else { var w2=elx("div",{style:"display:flex;flex-direction:column;gap:12px"});
      outgoing.forEach(function(id){ w2.append(swapCard(id,P,"out")); });
      recent.forEach(function(id){ w2.append(swapCard(id,P,"done")); });
      outB.append(w2); }
  }

  function swapCard(id,P,kind){
    var s=swaps[id]; var otherId = (s.fromId===myId)? s.toId : s.fromId; var otherName=nameFor(P,otherId);
    var card=elx("div",{class:"swap"+(kind==="in"?" incoming":"")});

    var ttl=elx("div",{class:"swap-ttl"});
    if(kind==="in"){ ttl.append(txt("Вам предлагает ")); ttl.append(elx("b",{text:otherName})); }
    else if(kind==="out"){ ttl.append(txt("Вы предложили ")); ttl.append(elx("b",{text:otherName})); ttl.append(txt(" · ждём ответа")); }
    else { ttl.append(elx("b",{text:otherName})); }
    card.append(ttl);

    // Что меняется — с точки зрения текущего зрителя
    // offerShift принадлежит fromId, wantShift принадлежит toId
    var iAmFrom = s.fromId===myId;
    var myLegId  = iAmFrom? s.offerShiftId : s.wantShiftId;   // моя смена в сделке
    var theirLegId = iAmFrom? s.wantShiftId : s.offerShiftId; // смена другого
    var trade=elx("div",{class:"trade"},[
      legEl("Ваша смена", myLegId), ico("arr","ic arr"), legEl("Смена "+otherName, theirLegId)
    ]);
    card.append(trade);

    var foot=elx("div",{class:"swap-foot"});
    if(kind==="in"){
      foot.append(btn("Согласиться","primary sm",function(){ accept(id); }));
      foot.append(btn("Отказаться","danger sm",function(){ resolve(id,"declined"); }));
    } else if(kind==="out"){
      foot.append(btn("Отменить","ghost sm",function(){ resolve(id,"cancelled"); }));
    } else {
      var v=elx("span",{class:"verdict "+(s.status==="accepted"?"ok":"no")});
      v.append(txt(s.status==="accepted"?"✓ Обмен принят": s.status==="declined"?"✕ Отклонено":"Отменено"));
      foot.append(v);
      foot.append(elx("button",{class:"dismiss",type:"button",title:"Скрыть","aria-label":"Скрыть",text:"×",onclick:function(){ dismiss(id); }}));
    }
    card.append(foot);
    return card;
  }

  function shiftsForDay(key){
    var out=[];
    var log=(sessions[myId]&&Array.isArray(sessions[myId].log))?sessions[myId].log:[];
    log.forEach(function(e){ if(e&&e.start && dateKey(new Date(e.start))===key) out.push({start:e.start,end:e.end||null,secs:e.secs||0,live:false}); });
    var cur=roster[myId];
    if(cur && cur.status && cur.status!=="off" && cur.shiftStart && dateKey(new Date(cur.shiftStart))===key){
      var ls=(cur.shiftSecs||0); if(cur.status==="on"&&!cur.lunch&&cur.workStart){ var s=(Date.now()-cur.workStart)/1000; if(s>0&&s<MAXSEG) ls+=s; }
      out.push({start:cur.shiftStart,end:null,secs:ls,live:true});
    }
    out.sort(function(a,b){ return a.start-b.start; });
    return out;
  }

      elx("button",{class:"navbtn",type:"button","aria-label":"Назад",disabled:atFloor?"":null,onclick:function(){ var d=new Date(y,m-1,1); if(d>=new Date(now.getFullYear(),now.getMonth(),1)){ sheet.pickMonth={y:d.getFullYear(),m:d.getMonth()}; render(); } }},[ico("chevL","ic")]),
      elx("div",{class:"mlabel",text:cap(monthName(y,m))}),
      elx("button",{class:"navbtn",type:"button","aria-label":"Вперёд",onclick:function(){ var d=new Date(y,m+1,1); sheet.pickMonth={y:d.getFullYear(),m:d.getMonth()}; render(); }},[ico("chev","ic")])
    ]));
    var dow=elx("div",{class:"pick-dow"}); DOWK.forEach(function(w){ dow.append(elx("span",{text:w})); }); wrap.append(dow);
    var map=monthMap(y,m,uid);
    var firstIx=(new Date(y,m,1).getDay()+6)%7, dim=new Date(y,m+1,0).getDate(), any=false;
    var grid=elx("div",{class:"pick-grid"});
    for(var bl=0;bl<firstIx;bl++) grid.append(elx("div",{class:"pc blank"}));
    for(var day=1;day<=dim;day++){ (function(day){
      var key=dateKey(new Date(y,m,day)); var ids=(map[key]||[]);
      if(!ids.length){ grid.append(elx("div",{class:"pc"},[ elx("div",{class:"pn",text:String(day)}) ])); return; }
      any=true; var sid=ids[0], s=schedule[sid], k=kindOf(s.start), seld=sheet.otherShiftId===sid;
      grid.append(elx("div",{class:"pc has k-"+k+(seld?" sel":""),title:(s.start||"")+"–"+(s.end||""),onclick:function(){ sheet.otherShiftId=sid; sheet.noSwap=false; render(); }},[
        elx("div",{class:"pn",text:String(day)}),
        elx("div",{class:"pk"},[ ico(k==="night"?"moon":"sun","ic") ])
      ]));
    })(day); }
    wrap.append(grid);
    if(!any) wrap.append(elx("div",{style:"text-align:center;color:var(--fg-faint);font-size:12.5px;padding:8px 2px"},[txt("В этом месяце смен нет — листайте вперёд")]));
    return wrap;
  }

  function submitSheet(pivotMine){
    if(!guard()) return;
    var pivot=schedule[sheet.pivotId]; if(!pivot){ closeModal(); return; }
    var toId, offerShiftId=null, wantShiftId=null;
    if(pivotMine){ toId=sheet.targetId; if(!toId){ toast("Выберите коллегу"); return; }
      offerShiftId=sheet.pivotId; wantShiftId=sheet.otherShiftId||null;
    } else { toId=pivot.userId; wantShiftId=sheet.pivotId; offerShiftId=sheet.otherShiftId||null; }
    writing=true;
    db.collection("swaps").add({ fromId:myId, toId:toId, offerShiftId:offerShiftId, wantShiftId:wantShiftId,
      status:"pending", createdAt:Date.now(), resolvedAt:null })
      .then(function(){ writing=false; closeModal(); setTab("swap"); toast("Предложение отправлено"); })
      .catch(function(e){ writing=false; render(); toast(e&&e.code==="invalid_argument"?"Нет прав на запись — нужен доступ Contributor":"Не удалось отправить"); });
  }

  // ---------- действия с хранилищем ----------
  function guard(){ if(writing) return false; if(!db){toast("Нет связи с хранилищем");return false;} if(!myId){toast("Войдите в аккаунт");return false;} return true; }

  // Чистая функция: из текущего состояния документа roster (cur) и желаемого статуса
  // вычисляет новый roster и патч для sessions (перенос часов за прошлый день + запись в журнал смен).
  // Ничего не читает из внешнего состояния — работает и в транзакции (с серверными данными), и в запасном пути.
  function computeStatus(cur,newStatus,newLunch,now,tk){
    cur=cur||{status:"off",lunch:false,workStart:null,todaySecs:0,shiftSecs:0,shiftStart:null,dayKey:tk};
    var ws=cur.workStart||null, todaySecs=cur.todaySecs||0, dk=cur.dayKey||tk;
    var shiftSecs=cur.shiftSecs||0, shiftStart=cur.shiftStart||null;
    var wasCount=(cur.status==="on"&&!cur.lunch);
    if(wasCount && ws){ var seg=Math.max(0,(now-ws)/1000); if(seg>MAXSEG) seg=0; todaySecs+=seg; shiftSecs+=seg; ws=null; }
    // смена суток — перенести отработанное за старый день в недельную историю (sessions.days)
    var sessPatch=null;
    if(dk!==tk){
      if(todaySecs>30){ var dd={}; dd[dk]=FV?FV.increment(Math.round(todaySecs)):Math.round(todaySecs); sessPatch={days:dd}; }
      todaySecs=0; dk=tk;
    }
    var wasOff=(cur.status==="off"), willOff=(newStatus==="off"), logEntry=null;
    if(wasOff && !willOff){ shiftStart=now; shiftSecs=0; }            // начало новой смены
    if(!wasOff && willOff){                                            // завершение смены → запись в журнал
      var total=Math.round(shiftSecs); var st=shiftStart||(now-total*1000);
      if(total>30) logEntry={start:st,end:now,secs:total};
      shiftStart=null; shiftSecs=0;
    }
    var willCount=(newStatus==="on"&&!newLunch); ws=willCount?now:null;
    if(logEntry){ sessPatch=sessPatch||{}; sessPatch.log=FV?FV.arrayUnion(logEntry):[logEntry]; }
    return { roster:{status:newStatus,lunch:!!newLunch,updatedAt:now,workStart:ws,
             todaySecs:todaySecs,shiftSecs:shiftSecs,shiftStart:shiftStart,dayKey:tk}, sessPatch:sessPatch };
  }

  function setStatus(newStatus,newLunch){
    if(!guard()) return;
    var now=Date.now(), tk=todayKey();

    // Запасной путь (если прямого доступа к Firestore нет) — без транзакции и без истории.
    if(!rawDb || !FV){
      var r0=computeStatus(roster[myId],newStatus,newLunch,now,tk);
      writing=true; render();
      db.collection("roster").doc(myId).set(r0.roster)
        .then(function(){ writing=false; render(); })
        .catch(function(e){ writing=false; render(); toast(e&&e.code==="invalid_argument"?"Нет прав на запись — нужен доступ Contributor":"Не удалось сохранить статус"); });
      return;
    }

    // Основной путь: транзакция читает актуальный документ с сервера, поэтому
    // устаревшая копия на другом устройстве больше не затирает накопленное время.
    var rRef=rawDb.collection("roster").doc(myId);
    var sRef=rawDb.collection("sessions").doc(myId);
    writing=true; render();
    rawDb.runTransaction(function(t){
      return t.get(rRef).then(function(snap){
        var cur=(snap&&snap.exists)?snap.data():null;
        var r=computeStatus(cur,newStatus,newLunch,now,tk);
        t.set(rRef,r.roster);
        if(r.sessPatch){ r.sessPatch.updatedAt=now; t.set(sRef,r.sessPatch,{merge:true}); }
        return null;
      });
    }).then(function(){ writing=false; render(); })
      .catch(function(e){ writing=false; render(); console.warn("setStatus",e);
        toast(e&&e.code==="invalid_argument"?"Нет прав на запись — нужен доступ Contributor":"Не удалось сохранить статус — проверьте связь"); });
  }

  function claimSlot(uid){ if(!guard()) return; if(!uid) return;
    var keys=Object.keys(schedule).filter(function(k){ return schedule[k].userId===uid; });
    if(!keys.length){ toast("Смены не найдены"); return; }
    writing=true; render();
    var i=0,done=0;
    (function next(){ if(i>=keys.length){ writing=false; render(); toast("Привязано смен: "+done); return; }
      var k=keys[i++]; db.collection("schedule").doc(k).update({userId:myId})
        .then(function(){ done++; next(); }).catch(function(){ next(); }); })();
  }
  // привязанные к себе смены из графика, сгруппированные по исходной роли (из id вида ..._S3)
  function myImportedGroups(){ var g={};
    Object.keys(schedule).forEach(function(k){ var s=schedule[k]; if(s.userId!==myId) return;
      var mm=/_(S\d+)$/.exec(k); if(!mm) return; var slot=mm[1];
      if(!g[slot]) g[slot]={slot:slot,name:s.name||slot,ids:[]}; g[slot].ids.push(k); });
    return Object.keys(g).sort().map(function(k){ return g[k]; });
  }
  function unclaimSlot(slot,ids){ if(!guard()) return;
    writing=true; render(); var i=0;
    (function next(){ if(i>=ids.length){ writing=false; render(); toast("Отвязано: "+slot); return; }
      var k=ids[i++]; db.collection("schedule").doc(k).update({userId:"imp:"+slot})
        .then(next).catch(next); })();
  }

  function addShift(date,start,end){ if(!guard()) return; writing=true;
    db.collection("schedule").add({userId:myId,date:date,start:start,end:end,createdAt:Date.now()})
      .then(function(){ writing=false; addFor=null; render(); toast("Смена добавлена"); })
      .catch(function(e){ writing=false; render(); toast("Не удалось добавить"); }); }

  function accept(id){ if(!guard()) return; var s=swaps[id]; if(!s){ return; }
    writing=true; render();
    var ops=[];
    // offerShift (от fromId) -> toId ; wantShift (от toId) -> fromId
    if(s.offerShiftId && schedule[s.offerShiftId]) ops.push(db.collection("schedule").doc(s.offerShiftId).update({userId:s.toId}));
    if(s.wantShiftId && schedule[s.wantShiftId]) ops.push(db.collection("schedule").doc(s.wantShiftId).update({userId:s.fromId}));
    Promise.all(ops).then(function(){
      return db.collection("swaps").doc(id).update({status:"accepted",resolvedAt:Date.now()});
    }).then(function(){ writing=false; render(); toast("Обмен выполнен — смены обновлены"); })
      .catch(function(e){ writing=false; render(); toast("Не удалось выполнить обмен"); });
  }
  function resolve(id,status){ if(!guard()) return; writing=true; render();
    db.collection("swaps").doc(id).update({status:status,resolvedAt:Date.now()})
      .then(function(){ writing=false; render(); toast(status==="declined"?"Отклонено":"Отменено"); })
      .catch(function(e){ writing=false; render(); toast("Не удалось"); }); }
  function dismiss(id){ if(!guard()) return; writing=true;
    db.collection("swaps").doc(id).delete().then(function(){ writing=false; render(); }).catch(function(e){ writing=false; render(); }); }

  // ---------- общие UI-куски ----------
  function skeleton(n){ var w=elx("div",{style:"display:flex;flex-direction:column;gap:10px;padding:6px 0"}); for(var i=0;i<n;i++) w.append(elx("div",{style:"height:42px;border-radius:10px;background:var(--surface-2)"})); return w; }
  function empty(icon,text){ var e=elx("div",{class:"empty"}); e.append(ico(icon,"ic")); e.firstChild.style.width="34px"; e.firstChild.style.height="34px";
    text.split("\n").forEach(function(l,i){ if(i)e.append(elx("br")); e.append(txt(l)); }); return e; }

  // ---------- вкладки ----------
  function setTab(name){ activeTab=name;
    ["shift","cal","swap","hist"].forEach(function(n){ document.getElementById("tab-"+n).setAttribute("aria-selected", n===name?"true":"false");
      document.getElementById("pane-"+n).hidden = n!==name; });
    render(); window.scrollTo({top:0,behavior:"smooth"});
  }
  ["shift","cal","swap","hist"].forEach(function(n){ document.getElementById("tab-"+n).addEventListener("click",function(){ setTab(n); }); });

  // ---------- подписки ----------
  function onErr(w){ return function(e){ console.warn(w,e); if(e&&e.code==="revoked"){ db=null; render(); } }; }
  function sub(coll,store,flag){ try{ db.collection(coll).onSnapshot(function(snap){ var o={}; snap.docs.forEach(function(d){ if(d.exists) o[d.id]=d.data(); });
      if(store==="roster") roster=o; else if(store==="sessions") sessions=o; else if(store==="schedule") schedule=o; else swaps=o;
      ready[flag]=true; if(store==="schedule") maybeAutoJump(); render(); }, onErr(coll)); }catch(e){ console.warn(e); } }

  function start(){
    applyTheme(curTheme()); updateThemeBtn();
    var tb=document.getElementById("themeBtn"); if(tb) tb.addEventListener("click",toggleTheme);
    try{ if(window.matchMedia){ window.matchMedia("(prefers-color-scheme:dark)").addEventListener("change",function(){ if(curTheme()==="system") updateThemeBtn(); }); } }catch(e){}
    render();
    var FB=window.__FB;
    if(!FB){ document.getElementById("livetxt").textContent="нет связи"; render(); return; }
    db=FB.db; user=FB.user; rawDb=FB.rawDb||null; FV=FB.FieldValue||null;
    FB.setRenderHook(render);
    var subscribed=false;
    FB.onAuth(function(uid){
      myId=uid||null;
      amAdmin = FB.isAdmin? FB.isAdmin() : false;
      if(uid && !subscribed){ subscribed=true;
        sub("roster","roster","roster"); sub("sessions","sessions","sessions"); sub("schedule","schedule","schedule"); sub("swaps","swaps","swaps");
        setTimeout(function(){ var c=roster[myId]; if(c && c.dayKey && c.dayKey!==todayKey()){ setStatus(c.status||"off", !!c.lunch); } },1500);
      }
      render();
    });
    setInterval(function(){ if(ready.roster||ready.sessions) render(); },60000);
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",start); else start();
})();
</script>
